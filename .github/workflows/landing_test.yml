name: Landing Randomness Test
on:
  push:
    paths: ["StikDebug/GpsSim/GpsSimPlaces.swift", "ci/landing/**", ".github/workflows/landing_test.yml"]
  workflow_dispatch:
concurrency:
  # A newer push makes the older run's screenshots/testers stale; free accounts get only 5 macOS jobs at once.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: bash ci/landing/run.sh
