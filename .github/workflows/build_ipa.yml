name: Build Debug IPA

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]*", "v[0-9]*" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle id (com.stik.stikdebug = the author's own phone build; com.pinfly.app = public build)"
        type: string
        default: "com.stik.stikdebug"

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      UPLOAD_IPA: ${{ vars.UPLOAD_IPA || 'true' }}
      # Tag builds are the public release (com.pinfly.app). push / pull_request runs have no inputs:
      # keep the author's existing id so his places and Shortcuts stay.
      PINFLY_BUNDLE_ID: ${{ github.ref_type == 'tag' && 'com.pinfly.app' || inputs.bundle_id || 'com.stik.stikdebug' }}

    steps:
      - name: 1. Fetch Source Code
        uses: actions/checkout@v6

      - name: Check bundle id
        run: |
          echo "$PINFLY_BUNDLE_ID" | grep -Eq '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$' || { echo "bad bundle_id: $PINFLY_BUNDLE_ID"; exit 1; }
          echo "Building bundle id $PINFLY_BUNDLE_ID"
          # The author's build keeps stikdebug:// (his Shortcuts may use it); others use pinfly://. Both keep stikjit:// (LiveContainer "Run with JIT" jumps back with it).
          if [ "$PINFLY_BUNDLE_ID" = "com.stik.stikdebug" ]; then
            echo "PINFLY_URL_SCHEME=stikdebug" >> "$GITHUB_ENV"
            echo "PINFLY_URL_SCHEME_ALT=stikjit" >> "$GITHUB_ENV"
          else
            echo "PINFLY_URL_SCHEME=pinfly" >> "$GITHUB_ENV"
            echo "PINFLY_URL_SCHEME_ALT=stikjit" >> "$GITHUB_ENV"
          fi
          {
            echo "### PinFly build"
            echo "- bundle id: \`$PINFLY_BUNDLE_ID\`"
            grep '^PINFLY_URL_SCHEME' "$GITHUB_ENV" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp build (short sha and date) shown in 設定 › 關於 › 版本 as v<x.y.z>（sha · date）
        run: plutil -insert GpsSimBuild -string "${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)" StikDebug/Info.plist

      - name: 2. Configure Xcode Environment
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'

      # Only SwiftPM checkouts are cached here (archive keeps clean, so the product is always built fresh).
      # Bust by bumping v1 in the key.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-v1-xcode26.6-${{ hashFiles('**/Package.resolved') }}

      - name: 3. Compile Project Archive
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PINFLY_BUNDLE_ID="$PINFLY_BUNDLE_ID" \
            PINFLY_URL_SCHEME="$PINFLY_URL_SCHEME" \
            PINFLY_URL_SCHEME_ALT="$PINFLY_URL_SCHEME_ALT" \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: 4. Package .app into .ipa
        run: |
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app .
          mkdir -p Payload
          cp -R StikDebug.app Payload/
          zip -r StikDebug.ipa Payload
          rm -rf Payload StikDebug.app

      - name: 5. Name workflow artifact
        id: artifact
        if: env.UPLOAD_IPA == 'true'
        run: |
          file_name="PinFly-${PINFLY_BUNDLE_ID}-${GITHUB_SHA::7}.ipa"
          cp StikDebug.ipa "$file_name"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: 6. Store IPA as Workflow Artifact
        if: env.UPLOAD_IPA == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.file_name }}
          archive: false
          retention-days: 90

      - name: 7. Compile Release archive (unsigned, for phone install)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          xcodebuild archive \
            -project StikDebug.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages \
            -scheme "StikDebug" \
            -configuration Release \
            -archivePath build/StikDebugRelease.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PINFLY_BUNDLE_ID="$PINFLY_BUNDLE_ID" \
            PINFLY_URL_SCHEME="$PINFLY_URL_SCHEME" \
            PINFLY_URL_SCHEME_ALT="$PINFLY_URL_SCHEME_ALT" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4
          mkdir -p PayloadR
          cp -R build/StikDebugRelease.xcarchive/Products/Applications/StikDebug.app PayloadR/
          mkdir -p relpkg && mv PayloadR relpkg/Payload
          (cd relpkg && zip -qr ../PinFly-${PINFLY_BUNDLE_ID}-release-${GITHUB_SHA::7}.ipa Payload)

      - name: 8. Store Release IPA artifact
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          path: PinFly-*-release-*.ipa
          archive: false
          retention-days: 30

      - name: Read version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(xcodebuild -project StikDebug.xcodeproj -scheme StikDebug -showBuildSettings | awk -F ' = ' '/ MARKETING_VERSION = / { print $2; exit }')
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Name release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: mv StikDebug.ipa "PinFly-${PINFLY_BUNDLE_ID}-${{ steps.version.outputs.version }}.ipa"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: PinFly-${{ env.PINFLY_BUNDLE_ID }}-${{ steps.version.outputs.version }}.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
