name: Simulator Screenshots

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Every iPhone/iPad size (default: quick = smallest + largest iPhone, largest iPad)"
        type: boolean
        default: false
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "StikDebug/GpsSim/**"
      - "StikDebug/Views/MainTabView.swift"
      - "ci/**"

permissions:
  contents: read

concurrency:
  # A newer push makes the older run's screenshots/testers stale; free accounts get only 5 macOS jobs at once.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build simulator app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Stamp build (short sha and date) shown in 設定 as 版本 v<x.y.z>（sha · date）
        run: plutil -insert GpsSimBuild -string "${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)" StikDebug/Info.plist

      - name: Retag prebuilt idevice lib for simulator (CI workspace copy only)
        run: bash ci/retag_idevice_sim.sh

      - name: Build for iphonesimulator
        run: |
          xcodebuild build \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4
          test -d build/Build/Products/Debug-iphonesimulator/StikDebug.app
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/sim-app.zip" StikDebug.app

      - name: Upload app for the matrix jobs
        uses: actions/upload-artifact@v7
        with:
          name: sim-app-zip-internal
          path: sim-app.zip
          retention-days: 1

      - name: Upload simulator app (for Appetize)
        run: cp sim-app.zip "sim-app-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: sim-app-*.zip
          archive: false
          retention-days: 30

  shots:
    name: Shots ${{ matrix.family }} ${{ matrix.shard }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every push: 3 representative sizes in 2 jobs (free accounts get 5 macOS jobs at once).
        # Version tag v* or manual run with full=true: every distinct size in 8 jobs.
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.full) && '[{"family":"iphone","shard":0,"of":5,"quick":0},{"family":"iphone","shard":1,"of":5,"quick":0},{"family":"iphone","shard":2,"of":5,"quick":0},{"family":"iphone","shard":3,"of":5,"quick":0},{"family":"iphone","shard":4,"of":5,"quick":0},{"family":"ipad","shard":0,"of":3,"quick":0},{"family":"ipad","shard":1,"of":3,"quick":0},{"family":"ipad","shard":2,"of":3,"quick":0}]' || '[{"family":"iphone","shard":0,"of":1,"quick":1},{"family":"ipad","shard":0,"of":1,"quick":1}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/download-artifact@v7
        with:
          name: sim-app-zip-internal
      - run: unzip -q sim-app.zip
      - name: Screenshots (every distinct logical size x 8 demo states)
        env:
          SHOTS_QUICK: ${{ matrix.quick }}
        run: python3 ci/sim_shots.py ${{ matrix.family }} ${{ matrix.shard }} ${{ matrix.of }} StikDebug.app shots
      - uses: actions/upload-artifact@v7
        with:
          name: sim-screens-${{ github.sha }}-${{ matrix.family }}${{ matrix.shard }}
          path: shots/*.png
          retention-days: 30
      - name: Build small review bundle (downscaled JPEGs)
        if: always()
        run: bash ci/make_summary.sh shots summary-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-summary-${{ github.sha }}-${{ matrix.family }}${{ matrix.shard }}
          path: summary-out/
          retention-days: 30
