name: Simulator Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "StikDebug/GpsSim/**"
      - "StikDebug/Views/MainTabView.swift"
      - "ci/**"

permissions:
  contents: read

jobs:
  build:
    name: Build simulator app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Retag prebuilt idevice lib for simulator (CI workspace copy only)
        run: bash ci/retag_idevice_sim.sh

      - name: Build for iphonesimulator
        run: |
          xcodebuild build \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4
          test -d build/Build/Products/Debug-iphonesimulator/StikDebug.app
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/sim-app.zip" StikDebug.app

      - name: Upload app for the matrix jobs
        uses: actions/upload-artifact@v7
        with:
          name: sim-app-zip-internal
          path: sim-app.zip
          retention-days: 1

      - name: Upload simulator app (for Appetize)
        run: cp sim-app.zip "sim-app-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: sim-app-*.zip
          archive: false
          retention-days: 30

  shots:
    name: Shots ${{ matrix.family }} ${{ matrix.shard }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: iphone, shard: 0, of: 5 }
          - { family: iphone, shard: 1, of: 5 }
          - { family: iphone, shard: 2, of: 5 }
          - { family: iphone, shard: 3, of: 5 }
          - { family: iphone, shard: 4, of: 5 }
          - { family: ipad, shard: 0, of: 3 }
          - { family: ipad, shard: 1, of: 3 }
          - { family: ipad, shard: 2, of: 3 }
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/download-artifact@v7
        with:
          name: sim-app-zip-internal
      - run: unzip -q sim-app.zip
      - name: Screenshots (every distinct logical size x 8 demo states)
        run: python3 ci/sim_shots.py ${{ matrix.family }} ${{ matrix.shard }} ${{ matrix.of }} StikDebug.app shots
      - uses: actions/upload-artifact@v7
        with:
          name: sim-screens-${{ github.sha }}-${{ matrix.family }}${{ matrix.shard }}
          path: shots/*.png
          retention-days: 30
