name: Simulator Testers

on:
  workflow_dispatch:
    inputs:
      full:
        description: "All 8 testers (default: quick = novice, offline, ipad)"
        type: boolean
        default: false
      only:
        description: "Comma-separated tester names to run (overrides full), e.g. pending,offline"
        type: string
        default: ""
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "ci/**"
      - "StikDebug/GpsSim/**"

permissions:
  contents: read

concurrency:
  # A newer push makes the older run's screenshots/testers stale; free accounts get only 5 macOS jobs at once.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build simulator app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Stamp build (short sha and date) shown in 設定 as 版本 v<x.y.z>（sha · date）
        run: plutil -insert GpsSimBuild -string "${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)" StikDebug/Info.plist

      - name: Retag prebuilt idevice lib for simulator (CI workspace copy only)
        run: bash ci/retag_idevice_sim.sh

      - name: Build for iphonesimulator
        run: |
          xcodebuild build \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4
          test -d build/Build/Products/Debug-iphonesimulator/StikDebug.app
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/sim-app.zip" StikDebug.app

      - uses: actions/upload-artifact@v7
        with:
          name: sim-app-zip-internal
          path: sim-app.zip
          retention-days: 1

  # Picks the tester list: `only` (names) wins, else full / v* tag = all 8, else the quick 3.
  # TESTLOG rule: retest only what changed, so `only` lets a manual run skip the rest.
  plan:
    name: Pick testers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
          FULL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.full }}
        run: |
          all='[{"tester":"novice","scenario":"novice","devices":"iPhone SE (3rd generation)"},{"tester":"rushed","scenario":"rushed","devices":"iPhone 16e;iPhone 13 mini"},{"tester":"careless","scenario":"careless","devices":"iPhone 16"},{"tester":"offline","scenario":"offline","devices":"iPhone 13 Pro Max;iPhone 17 Pro Max"},{"tester":"advanced","scenario":"advanced","devices":"iPhone 16 Pro Max"},{"tester":"ipad","scenario":"ipad","devices":"iPad Pro 13-inch (M5);iPad Pro 13-inch (M4);iPad Pro 13-inch (M3)"},{"tester":"pending","scenario":"renew_pending","devices":"iPhone SE (3rd generation)"},{"tester":"addplace","scenario":"add_place","devices":"iPhone 16"}]'
          if [ -n "$ONLY" ]; then
            m=$(jq -c --arg only ",$ONLY," '[.[] | select(.tester as $t | $only | contains(","+$t+","))]' <<<"$all")
          elif [ "$FULL" = "true" ]; then
            m="$all"
          else
            m=$(jq -c '[.[] | select(.tester=="novice" or .tester=="offline" or .tester=="ipad")]' <<<"$all")
          fi
          echo "testers: $m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  tester:
    name: Tester ${{ matrix.tester }}
    needs: [build, plan]
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/download-artifact@v7
        with:
          name: sim-app-zip-internal
      - run: unzip -q sim-app.zip
      - name: Install AXe (tap/type/swipe by accessibility label; https://github.com/cameroncooke/AXe)
        run: brew install cameroncooke/axe/axe
      - name: Play scenario
        run: python3 ci/run_scenario.py ${{ matrix.scenario }} "${{ matrix.devices }}" StikDebug.app out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tester-${{ matrix.tester }}-${{ github.sha }}
          path: out/
          retention-days: 30
      - name: Build small review bundle (downscaled JPEGs, logs, summary)
        if: always()
        run: bash ci/make_summary.sh out summary-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tester-summary-${{ matrix.tester }}-${{ github.sha }}
          path: summary-out/
          retention-days: 30
